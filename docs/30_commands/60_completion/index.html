<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>completion</title>
    <link rel="stylesheet" href="../../doc.css" />
    <script>try{var t=localStorage.getItem("mayfly-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  </head>
  <body>
    <h1><code>mayfly completion</code></h1>
    <p class="muted">Print a shell completion script for subcommands and flags.</p>
    <pre><code>mayfly completion &lt;bash|zsh&gt;</code></pre>

    <h2>Install</h2>
    <pre><code># zsh
source &lt;(mayfly completion zsh)

# bash
source &lt;(mayfly completion bash)</code></pre>
    <p class="muted">Add the line to your shell rc, or save the output to a file on your completion path.</p>
  </body>
</html>
