<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>completion</title>
    <style>
      body { font-family: system-ui, sans-serif; line-height: 1.65; color: #1b1f24; background: #fff; margin: 0; padding: 2.2rem clamp(1rem,5vw,3.5rem); max-width: 52rem; }
      h1 { margin: .2rem 0 1rem; } h2 { margin-top: 2rem; border-bottom: 1px solid #eaecef; padding-bottom: .3rem; }
      code { background: #f3f4f6; padding: .12em .4em; border-radius: 5px; font-size: .9em; }
      pre { background: #0d1117; color: #e6edf3; padding: 1rem; border-radius: 8px; overflow: auto; }
      pre code { background: none; padding: 0; color: inherit; }
      .muted { color: #57606a; }
    </style>
  </head>
  <body>
    <h1><code>mayfly completion</code></h1>
    <p class="muted">Print a shell completion script for subcommands and flags.</p>
    <pre><code>mayfly completion &lt;bash|zsh&gt;</code></pre>

    <h2>Install</h2>
    <pre><code># zsh
source &lt;(mayfly completion zsh)

# bash
source &lt;(mayfly completion bash)</code></pre>
    <p class="muted">Add the line to your shell rc, or save the output to a file on your completion path.</p>
  </body>
</html>
