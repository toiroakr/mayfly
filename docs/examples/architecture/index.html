<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Architecture Diagram</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 2.5rem; background: #fff; color: #1b1f24; }
      h1 { margin: 0 0 1.5rem; }
      svg { max-width: 100%; height: auto; }
      .box { fill: #eef2ff; stroke: #6e9bff; }
      .lbl { font: 14px system-ui, sans-serif; fill: #1b1f24; }
      .edge { stroke: #8b949e; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </head>
  <body>
    <h1>Architecture Diagram</h1>
    <svg viewBox="0 0 520 120" width="520">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e" />
        </marker>
      </defs>
      <rect class="box" x="10" y="35" width="120" height="50" rx="8" />
      <text class="lbl" x="70" y="65" text-anchor="middle">CLI</text>
      <line class="edge" x1="130" y1="60" x2="195" y2="60" />
      <rect class="box" x="200" y="35" width="120" height="50" rx="8" />
      <text class="lbl" x="260" y="65" text-anchor="middle">Actions</text>
      <line class="edge" x1="320" y1="60" x2="385" y2="60" />
      <rect class="box" x="390" y="35" width="120" height="50" rx="8" />
      <text class="lbl" x="450" y="65" text-anchor="middle">Artifact / Pages</text>
    </svg>
  </body>
</html>
