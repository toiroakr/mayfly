<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🦋 mayfly — kept previews</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, sans-serif;
        background: radial-gradient(circle at 50% 30%, #2a3b5e, #0d1117);
        color: #e6edf3;
      }
      main { text-align: center; max-width: 36rem; padding: 2rem; }
      h1 { font-size: 3rem; margin: 0 0 .5rem; }
      p { opacity: .8; line-height: 1.6; }
      code { background: rgba(255,255,255,.1); padding: .15em .4em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>🦋 mayfly</h1>
      <p>This is the GitHub Pages root for kept previews.</p>
      <p>
        Throwaway previews live as ephemeral artifacts (<code>mayfly push</code>).
        The ones worth keeping are promoted here via <code>mayfly keep</code>,
        which opens a PR placing them under <code>docs/&lt;path&gt;</code> — once merged,
        each is reachable at a stable URL on this site.
      </p>
    </main>
  </body>
</html>
