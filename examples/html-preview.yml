# Drop this into an existing repo as `.github/workflows/html-preview.yml`.
# On every PR that touches an .html file, mayfly uploads each file as a
# browser-viewable artifact and posts the preview URLs as a PR comment.
#
# Previews live in *this* repo, so access is controlled by this repo's
# permissions (private repo => viewers must be authenticated collaborators).

name: HTML Preview

on:
  pull_request:
    paths:
      - '**.html'

jobs:
  preview:
    uses: toiroakr/mayfly/.github/workflows/preview.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # Optional: preview a fixed set instead of just the PR's changed files.
    # with:
    #   files: 'dist/**/*.html'
