name: Preview

# Turns pushed .html files into browser-viewable artifacts and comments the
# URLs on the commit. PR-level commenting is handled by the mayfly CLI
# (`mayfly push --pr N`), not by this workflow.

on:
  push:
    paths:
      - '**.html'
      - '!docs/**'   # docs/ is published via Pages (pages.yml), not previews

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed HTML files
        id: collect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE_SHA" ] \
             || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git ls-files '*.html')
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.html')
          fi
          CHANGED=$(printf '%s\n' "$CHANGED" | while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && printf '%s\n' "$f"
          done)
          FILES=$(printf '%s\n' "$CHANGED" | grep -v '^$' | jq -R . | jq -c -s .)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed: $FILES"

  upload:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect.outputs.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute artifact name
        id: name
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=$(printf '%s' "$FILE" | tr '/' '_')" >> "$GITHUB_OUTPUT"

      # Artifact previews are served without a charset in the Content-Type
      # header, so a UTF-8 page with no in-file declaration renders as mojibake.
      # Inject <meta charset="utf-8"> (after the doctype if present, else at the
      # top — must land within the first 1024 bytes) before uploading. The
      # committed file is left untouched; only the uploaded copy is patched.
      - name: Ensure charset declaration
        env:
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          if ! head -c 1024 "$FILE" | grep -qi 'charset='; then
            perl -0777 -pi -e 's/\A(\s*<!doctype[^>]*>)/$1\n<meta charset="utf-8">/i
                               or s/\A/<meta charset="utf-8">\n/' "$FILE"
            echo "mayfly: injected <meta charset=\"utf-8\"> into $FILE"
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          archive: false

  comment:
    needs: [detect, upload]
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # post the commit comment
      actions: read      # list this run's artifacts (private repos enforce this)
    steps:
      - name: Comment preview URLs on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          ARTS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
                 --jq '.artifacts[] | [.name, (.id|tostring)] | @tsv')
          BODY="$RUNNER_TEMP/mayfly-body.md"
          {
            printf '🦋 **mayfly preview**\n\n'
            printf '%s\n' "$ARTS" | while IFS=$'\t' read -r name id; do
              [ -n "$name" ] || continue
              printf -- '- [%s](%s/%s/actions/runs/%s/artifacts/%s)\n' \
                "$name" "$SERVER" "$REPO" "$RUN_ID" "$id"
            done
            printf '\nOpen an artifact, then view it in your browser. Expires in 90 days.\n'
          } > "$BODY"
          # Best-effort: the commit comment is a convenience (the CLI already
          # prints the URLs to stdout), so don't let a comment failure fail the
          # whole preview build.
          if gh api "repos/$REPO/commits/$SHA/comments" -F "body=@$BODY" >/dev/null 2>&1; then
            echo "mayfly: posted preview URLs as a commit comment"
          else
            echo "mayfly: note: could not post the commit comment; the preview artifacts are unaffected and the URLs are in the CLI output." >&2
          fi
