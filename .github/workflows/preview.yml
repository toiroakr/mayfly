name: Preview

on:
  push:
    paths:
      - '**.html'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed HTML files
        id: collect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE_SHA" ] \
             || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # New branch or shallow history: target all .html files
            CHANGED=$(git ls-files '*.html')
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.html')
          fi
          FILES=$(printf '%s\n' "$CHANGED" | grep -v '^$' | jq -R . | jq -c -s .)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed: $FILES"

  upload:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact name
        id: name
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=$(printf '%s' "$FILE" | tr '/' '_')" >> "$GITHUB_OUTPUT"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ matrix.file }}
          archive: false

  comment:
    needs: [detect, upload]
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Comment preview URLs on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ARTS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                 -q '.artifacts[] | "\(.name)\t\(.id)"')
          LINES=""
          while IFS=$'\t' read -r name id; do
            [ -n "$name" ] || continue
            LINES="$LINES
          - [$name](https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$id)"
          done <<< "$ARTS"

          BODY="🦋 **mayfly preview**
          $LINES

          Click a file to view it in the browser. Expires in 90 days."

          gh api "repos/$REPO/commits/$SHA/comments" -f body="$BODY"
