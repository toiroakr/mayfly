name: zizmor

# Static security analysis of the workflows themselves (zizmor).
# https://github.com/zizmorcore/zizmor

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          # Fail the job on findings instead of uploading SARIF to the Security
          # tab (keeps this dependency-light; no code-scanning setup needed).
          advanced-security: false
