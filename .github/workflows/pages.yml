name: Pages

# Publishes the docs/ directory to GitHub Pages whenever the default branch
# changes it. "Kept" previews (mayfly keep) land under docs/<path> via a PR;
# merging that PR triggers this deploy, giving a stable URL.
#
# On a GitHub Enterprise Cloud org you can set Pages visibility to "private"
# (Settings > Pages) so the published site is restricted to people with repo
# access — that is what makes kept previews access-controlled.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
