name: Cleanup stale branches

# Delete throwaway preview/* branches with no commits for 90 days.
# Matched to the Actions artifact default retention (90 days). Only preview/*
# branches are touched, so hand-made branches (including keep/* PRs) are safe.

on:
  schedule:
    - cron: '0 0 * * *' # daily 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STALE_DAYS: '90'
    steps:
      - name: Delete stale preview/* branches
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "$STALE_DAYS days ago" +%s)

          gh api "repos/$REPO/branches" --paginate -q '.[].name' | while IFS= read -r b; do
            case "$b" in preview/*) ;; *) continue;; esac
            DATE=$(gh api "repos/$REPO/commits/$b" -q '.commit.committer.date')
            TS=$(date -u -d "$DATE" +%s)
            if [ "$TS" -lt "$CUTOFF" ]; then
              echo "Deleting stale branch: $b (last commit $DATE)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            fi
          done
