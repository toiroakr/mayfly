name: Keep preview

# When `mayfly keep` opens a PR that adds docs/<path>.html, build a
# browser-viewable artifact for each changed page and comment its preview URL on
# the PR — so reviewers can see the page before merging (merge publishes it to
# Pages). Scoped to docs/** so it only fires for keep PRs.

on:
  pull_request:
    paths:
      - 'docs/**.html'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect changed docs HTML
        id: collect
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- 'docs/*.html')
          CHANGED=$(printf '%s\n' "$CHANGED" | while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && printf '%s\n' "$f"
          done)
          FILES=$(printf '%s\n' "$CHANGED" | grep -v '^$' | jq -R . | jq -c -s .)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed: $FILES"

  upload:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect.outputs.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=$(printf '%s' "$FILE" | tr '/' '_')" >> "$GITHUB_OUTPUT"
      # Artifact previews are served without a charset header; inject
      # <meta charset="utf-8"> into the uploaded copy when the file has no
      # declaration in its first 1024 bytes (see preview.yml for details).
      - name: Ensure charset declaration
        env:
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          if ! head -c 1024 "$FILE" | grep -qi 'charset='; then
            perl -0777 -pi -e 's/\A(\s*<!doctype[^>]*>)/$1\n<meta charset="utf-8">/i
                               or s/\A/<meta charset="utf-8">\n/' "$FILE"
            echo "mayfly: injected <meta charset=\"utf-8\"> into $FILE"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          archive: false

  comment:
    needs: [detect, upload]
    # Same-repo PRs only (fork tokens are read-only).
    if: >-
      needs.detect.outputs.files != '[]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Comment preview URLs on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SERVER: ${{ github.server_url }}
          MARKER: '<!-- mayfly-keep-preview -->'
        run: |
          set -euo pipefail
          ARTS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
                 --jq '.artifacts[] | [.name, (.id|tostring)] | @tsv')
          BODY="$RUNNER_TEMP/body.md"
          {
            printf '%s\n🦋 **keep preview** — review before merge:\n\n' "$MARKER"
            printf '%s\n' "$ARTS" | while IFS=$'\t' read -r name id; do
              [ -n "$name" ] || continue
              printf -- '- [%s](%s/%s/actions/runs/%s/artifacts/%s)\n' \
                "$name" "$SERVER" "$REPO" "$RUN_ID" "$id"
            done
            printf '\nOpen an artifact, then view it in your browser. Merging publishes it to Pages.\n'
          } > "$BODY"
          CID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                --jq 'map(select(.body | contains("<!-- mayfly-keep-preview -->"))) | .[0].id // empty')
          if [ -n "$CID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$CID" -F "body=@$BODY" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$BODY" >/dev/null
          fi
